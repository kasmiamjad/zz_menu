<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z&Z | Premium Digital Menu</title>
    
    <!-- Favicon -->
    <link rel="icon" href="image/zandzlogo.png" type="image/png">
    
    <!-- Open Graph / Link Sharing -->
    <meta property="og:title" content="Z&Z | Premium Digital Menu">
    <meta property="og:description" content="Explore our premium digital menu at Z&Z Restaurant.">
    <meta property="og:image" content="image/thumnail.jpeg">
    <meta property="og:type" content="website">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Italiana&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1">
</head>

<body>
    <div class="hero">
        <img src="image/bg.jpeg" alt="Z&Z Restaurant" class="hero-image">
        <div class="hero-overlay"></div>
        <!-- <button class="user-icon">👤</button> -->
        <div class="hero-logo">
            <img src="image/ZZ_golden.png" alt="Z&Z Restaurant Logo" class="hero-logo-img">
        </div>
    </div>

    <div class="container">
        <div class="tabs-container">
            <div class="tabs" id="category-tabs">
                <button class="tab active" data-category="all">
                    <div class="tab-icon">🍽️</div>
                    <span>All Items</span>
                </button>
            </div>
        </div>

        <!-- <div class="view-toggle">
            <button class="toggle-btn active" data-view="list">☰</button>
            <button class="toggle-btn" data-view="grid">▦</button>
        </div> -->

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="🔍 Search for dishes...">
        </div>

        <main id="menu-container">
            <div class="loading">Loading menu...</div>
        </main>
    </div>

    <!-- Dish Detail Modal -->
    <div class="dish-modal" id="dish-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <div class="modal-image-container">
                <button class="modal-nav modal-prev" id="modal-prev">←</button>
                <img src="" alt="" class="modal-image" id="modal-image">
                <button class="modal-nav modal-next" id="modal-next">→</button>
            </div>
            <div class="modal-details">
                <div class="modal-name-row">
                    <h2 class="modal-dish-name" id="modal-dish-name"></h2>
                    <span class="spicy-badge" id="modal-spicy-badge" style="display:none;" title="Spicy"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor"><path d="M446.738 28.814c-25.117 13.687-48.889 42.68-61.957 71.809c-7.818-2.893-16.676-4.618-25.513-4.545c-14.73.121-29.385 5.227-39.008 18.168c.886.005 1.774.018 2.666.05c12.22.443 24.958 3.41 37.304 8.102c22.98 8.734 45.207 23.286 58.29 41.83c12.723-30.603-.83-45.203-17.569-55.43c11.733-25.618 34.789-53.49 54.4-64.177zM319.824 132.261a59 59 0 0 0-6.894.35c-11.725 1.322-19.854 5.705-24.686 14.477c-45.314 82.267-40.39 117.237-53.092 156.177c-6.35 19.47-17.347 39.092-40.322 63.21c-22.975 24.116-57.954 53.12-113.379 93.007c-12.743 9.171-20.766 16.8-24.03 21.39c-.686.967-.496.828-.773 1.417c2.1.465 6.218 1.262 13.534.709c9.923-.751 23.7-3.263 40.53-7.672c85.471-22.392 164.479-75.553 220.118-132.317c27.82-28.381 49.794-57.658 63.861-84.048s19.84-49.872 17.239-65.627c-3.273-19.817-29.295-43.162-58.096-54.11c-10.8-4.105-21.814-6.517-31.592-6.908a70 70 0 0 0-2.418-.055m1.977 17.813c1.725.06 3.385.555 4.967 1.533c-22.945 39.64-46.91 81.1-60.47 138.438c-22.95-11.989 25.686-141.007 55.503-139.971"/></svg></span>
                </div>
                <div class="modal-price-badge" id="modal-price-badge"></div>
                <p class="modal-dish-description" id="modal-dish-description"></p>
                <div class="modal-dish-price" id="modal-dish-price"></div>
            </div>
        </div>
    </div>

    <!-- <div class="checkout-bar">
        <button class="checkout-btn">Checkout order</button>
    </div>

    <div style="text-align: center; padding: 20px; opacity: 0.3;">
        <a href="admin.html" style="color: white; text-decoration: none; font-size: 0.7rem;">Admin Panel</a>
    </div> -->

    <script src="script.js"></script>
</body>

</html>
